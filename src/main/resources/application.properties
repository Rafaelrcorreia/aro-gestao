# Nome da aplicacao
spring.application.name=aro-gestao

# Configuracao do banco de dados MySQL
# Usa variaveis de ambiente DB_URL, DB_USERNAME e DB_PASSWORD.
# A senha NAO tem valor padrao: defina DB_PASSWORD ou crie o arquivo
# src/main/resources/application-local.properties (ignorado pelo git) com:
#   spring.datasource.password=sua_senha
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aro_gestao}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracao do Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Porta do servidor
server.port=8080