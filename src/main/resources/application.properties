# Nome da aplicacao
spring.application.name=aro-gestao

# Configuracao do banco de dados MySQL
# Usa variaveis de ambiente DB_URL, DB_USERNAME e DB_PASSWORD.
# A senha NAO tem valor padrao: defina DB_PASSWORD ou crie o arquivo
# src/main/resources/application-local.properties (ignorado pelo git) com:
#   spring.datasource.password=sua_senha
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aro_gestao}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracao do Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Porta do servidor
server.port=8080

# Documentos enviados (arquivos ficam fora do banco, nesta pasta)
# Use a variavel DOCUMENTOS_DIR para trocar o local (ex.: em producao)
aro.documentos.diretorio=${DOCUMENTOS_DIR:uploads/documentos}

# Tamanho maximo de upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
# Deixa o Tomcat ler o excesso para conseguir responder "arquivo grande demais"
# em vez de derrubar a conexao
server.tomcat.max-swallow-size=50MB
